replicaCount: 1

service:
  webserver:
    name: webserver
    repository: ghcr.io/paperless-ngx/paperless-ngx
    tag: latest
    targetPort: 8000
    depends_on:
      - broker
      - gotenberg
      - tika
  broker:
    name: broker
    repository: docker.io/valkey/valkey
    tag: 9-alpine
  tika:
    name: tika
    repository: docker.io/apache/tika
    tag: 3.3.1.0
  gotenberg:
    name: gotenberg
    repository: docker.io/gotenberg/gotenberg
    tag: 8.36
    command:
      - "gotenberg"
      - "--chromium-disable-javascript=true"
      - "--chromium-allow-list=file:///tmp/.*"
  port: 80
  targetPort: 8000
  type: ClusterIP

hostPathVolumes:
  - name: export-volume
    hostPath: ./export
    mountPath: /usr/src/paperless/export
  - name: consume-volume
    hostPath: ./home/dk/paperless-inbox
    mountPath: /usr/src/paperless/consume

env:
  PAPERLESS_REDIS: "redis://localhost:6379"
  PAPERLESS_DBENGINE: "sqlite"
  PAPERLESS_TIKA_ENABLED: "1"
  PAPERLESS_TIKA_GOTENBERG_ENDPOINT: "http://localhost:3000"
  PAPERLESS_TIKA_ENDPOINT: "http://localhost:9998"

ingress:
  enabled: true
  className: ""
  annotations: {}
  host: paperless.dipakkurkute.dev

serviceAccount:
  create: false

httpRoute:
  create: false

autoscaling:
  create: false
