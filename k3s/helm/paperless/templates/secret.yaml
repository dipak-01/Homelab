apiVersion: v1
kind: Secret
metadata:
    name: "{{ .Release.Name }}-secret"
type: Opaque
stringData: 
    PAPERLESS_URL: "{{ .Values.secret.PAPERLESS_URL}}"
    PAPERLESS_CSRF_TRUSTED_ORIGINS: "{{ .Values.secret.PAPERLESS_CSRF_TRUSTED_ORIGINS}}"
    PAPERLESS_SECRET_KEY: "{{ .Values.secret.PAPERLESS_SECRET_KEY}}"
    PAPERLESS_OCR_LANGUAGE: "{{ .Values.secret.PAPERLESS_OCR_LANGUAGE}}"

            