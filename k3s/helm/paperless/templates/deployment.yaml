apiVersion: apps/v1
kind: Deployment
metadata:
  name: "{{ .Release.Name }}-app"
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      app: {{ .Release.Name }}
  template:
    metadata:
      labels:
        app: {{ .Release.Name }}
    spec:
      containers:
        - name: "{{ .Release.Name }}-webserver"
          image: "{{ .Values.service.webserver.repository }}:{{ .Values.service.webserver.tag }}"
          ports:
            - containerPort: 8000
          env:
            {{- range $key, $value := .Values.env }}
            - name: {{ $key | quote }}
              value: {{ $value | quote }}
            {{- end }}
            {{- range $key, $value := .Values.secret }}
            - name: {{ $key | quote }}
              value: {{ $value | quote }}
            {{- end }}

          volumeMounts: 
            - name: data-volume
              mountPath: /usr/src/paperless/data
            - name: media-volume
              mountPath: /usr/src/paperless/media
            - name: export-volume
              mountPath: /usr/src/paperless/export
            - name: consume-volume
              mountPath: /usr/src/paperless/consume
         
        - name: "{{ .Release.Name }}-broker"
          image: "{{ .Values.service.broker.repository }}:{{ .Values.service.broker.tag }}"
          volumeMounts:
            - name: redis-volume
              mountPath: /data
         
        - name: "{{ .Release.Name }}-tika"
          image: "{{ .Values.service.tika.repository }}:{{ .Values.service.tika.tag }}"
         
        - name: "{{ .Release.Name }}-gotenberg"
          image: "{{ .Values.service.gotenberg.repository }}:{{ .Values.service.gotenberg.tag }}"
          command:
            {{- toYaml .Values.service.gotenberg.command | nindent 12 }}
      volumes:    
          - name: data-volume
            persistentVolumeClaim:
              claimName: "{{ .Release.Name }}-data"
          - name: media-volume
            persistentVolumeClaim:
              claimName: "{{ .Release.Name }}-media"
          - name: export-volume
            persistentVolumeClaim:
              claimName: "{{ .Release.Name }}-export"
          - name: redis-volume
            persistentVolumeClaim:
              claimName: "{{ .Release.Name }}-redis"
          - name: consume-volume
            persistentVolumeClaim:
              claimName: "{{ .Release.Name }}-consume"
