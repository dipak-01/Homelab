apiVersion: v1
kind: Secret
metadata:
    name: "{{ .Release.Name }}-secret"
type: Opaque
stringData: 
  UPLOAD_LOCATION: {{ .Values.secret.UPLOAD_LOCATION }}
  DB_DATA_LOCATION: {{ .Values.secret.DB_DATA_LOCATION }}
  IMMICH_VERSION: {{ .Values.secret.IMMICH_VERSION }}
  DB_PASSWORD: {{ .Values.secret.DB_PASSWORD }}
  DB_USERNAME: {{ .Values.secret.DB_USERNAME }}
  DB_DATABASE_NAME: {{ .Values.secret.DB_DATABASE_NAME }}


            