apiVersion: v1
kind: PersistentVolumeClaim
metadata: 
    name: "{{ .Release.Name }}-uploads"
spec: 
    accessModes:
        - ReadWriteOnce
    resources:
        requests:
            storage: 20Gi
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata: 
    name: "{{ .Release.Name }}-model-cache"
spec: 
    accessModes:
        - ReadWriteOnce
    resources:
        requests:
            storage: 10Gi
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata: 
    name: "{{ .Release.Name }}-postgres"
spec: 
    accessModes:
        - ReadWriteOnce
    resources:
        requests:
            storage: 10Gi
